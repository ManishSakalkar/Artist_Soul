<div class="carousel-wrapper">
  <h2 class="carousel-title">Our Featured Art</h2>
  <h3>Each piece in our collection is carefully crafted with intention & love. Discover artwork that speaks to your soul and transforms your space.

</h3>
  <div class="carousel">
    <div class="carousel-item" *ngFor="let art of artStyles">
      <img [src]="art.image" [alt]="art.title" />
      <h3>{{ art.title }}</h3>
    </div>
  </div>
</div>
