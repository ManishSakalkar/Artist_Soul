<section class="shop-by-category">
<div class="boho-header">
<h2 class="title">{{ sectionTitle }}</h2>
<p class="slogan">{{ sectionSlogan }}</p>
</div>

<div class="category-grid">
<div
class="category-card"
*ngFor="let category of categories()"
>
<div class="card-image-container">
<img [src]="category.image" [alt]="category.name" class="category-image" />
</div>
<div class="card-content">
<h3 class="category-title">{{ category.name }}</h3>
<p class="category-slogan">{{ category.slogan }}</p>
<div class="card-footer">
<span class="customization-label">Handcrafted & Customizable</span>
<a href="#" class="view-button">
View Pieces
</a>
</div>
</div>
</div>
</div>
</section>
