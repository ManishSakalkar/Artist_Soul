<section class="shop-by-category">
  <h2>Shop by Category</h2>
  <div class="category-grid">
    <div class="category-card" [routerLink]="['/category', 'canvas']">
      <img src="assets/category-canvas.jpg" alt="Canvas Art" class="category-image">
      <p class="category-title">Canvas Art</p>
    </div>
    <div class="category-card" [routerLink]="['/category', 'liipan']">
      <img src="assets/category-liipan.jpg" alt="Liipan Art" class="category-image">
      <p class="category-title">Liipan Art</p>
    </div>
    <div class="category-card" [routerLink]="['/category', 'sketching']">
      <img src="assets/category-sketching.jpg" alt="Sketching Art" class="category-image">
      <p class="category-title">Sketching</p>
    </div>
  </div>
</section>
