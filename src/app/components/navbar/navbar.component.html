<nav class="boho-navbar">
  <input type="checkbox" id="menu-toggle" />

  <div class="nav-row">
    <div class="nav-left">
      <img src="assets/Artistic_Soul.png" alt="Artistic Soul Logo" class="logo" />
      <span class="brand-name">Artistic Soul</span>
    </div>

    <label for="menu-toggle" class="menu-icon">&#9776;</label>

    <ul class="nav-center">
      <li><a routerLink="/" class="nav-link">Home</a></li>
      <li><a routerLink="/gallery" class="nav-link">Gallery</a></li>
      <li><a routerLink="/about" class="nav-link">About</a></li>
      <li><a routerLink="/contact" class="nav-link">Contact</a></li>
      <li><a routerLink="/profile" class="nav-link">Profiles</a></li>
    </ul>

    <div class="nav-right">
  <ng-container *ngIf="!isLoggedIn; else loggedInBlock">
    <button class="btn login-btn" (click)="openAuthModal()">Login</button>
  </ng-container>

  <ng-template #loggedInBlock>
    <button class="btn logout-btn" (click)="logout()">Logout</button>
    <div class="welcome-message">Welcome,<br />{{ userName }}</div>
  </ng-template>

  <a routerLink="/cart" class="cart-btn">
    <div class="cart-icon-wrapper">
      <i data-feather="shopping-cart"></i>
      <span class="cart-count" *ngIf="cartCount > 0">{{ cartCount }}</span>
    </div>
  </a>
</div>

  <div class="auth-modal-overlay" *ngIf="showAuthModal">
  <div class="auth-modal">

    <div class="modal-header">
    <h2>Login or Sign Up</h2>
    <button class="close-modal" (click)="closeAuthModal()">x</button>
  </div>
    <input type="text" placeholder="Your Name" #nameInput />
    <input type="email" placeholder="Email" />
    <input type="password" placeholder="Password" />
    <div class="auth-buttons">
      <button (click)="handleLoginSuccess(nameInput.value)">Login</button>
      <button (click)="handleLoginSuccess(nameInput.value)">Sign Up</button>
    </div>
  </div>
</div>

  
  
  </div>
</nav>
