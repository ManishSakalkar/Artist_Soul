<!-- \Auth Model -->
<div class="auth-modal-overlay" *ngIf="showAuthModal">
  <div class="auth-modal">
    <div class="modal-header">
      <h2>Welcome to Artistic Soul</h2>
      <button class="close-modal" (click)="closeAuthModal()">×</button>
    </div>

    <p class="modal-subtitle">Log in to explore soulful creations</p>

    <form (ngSubmit)="handleLogin(nameInput.value, emailInput.value, passwordInput.value)">
      <input type="text" placeholder="Your Name" #nameInput required />
      <input type="email" placeholder="Email" #emailInput required />
      <input type="password" placeholder="Password" #passwordInput required />

      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="auth-buttons">
        <button type="submit">Login</button>
        <button type="button" (click)="handleLogin(nameInput.value, emailInput.value, passwordInput.value)">Sign Up</button>
      </div>
    </form>
  </div>
</div>
