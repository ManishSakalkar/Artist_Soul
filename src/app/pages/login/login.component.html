<div class="login-page">
  <div class="login-card">
    <h2>Welcome to Artistic Soul</h2>
    <p class="subtitle">Log in to explore soulful creations</p>

    <input type="text" placeholder="Your Name" [(ngModel)]="userName" />
    <input type="email" placeholder="Email" [(ngModel)]="email" />
    <input type="password" placeholder="Password" [(ngModel)]="password" />

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button (click)="handleLogin()">Login</button>
    <p class="signup-link">Don't have an account? <a routerLink="/signup">Sign Up</a></p>
  </div>
</div>
